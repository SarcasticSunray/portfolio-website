<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Favorite Devotionals</title>
  <link rel="stylesheet" href="styles/styles.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-image">
        <h1>My Favorite<br>Devotionals</h1>
      </div>
    </header>
    <main>
      <div class="content-box">
        <table>
          <tr>
            <th>Speaker</th>
            <th>Title</th>
            <th>Location</th>
            <th>Year</th>
          </tr>
          <tr>
            <td>Elder David A. Bednar</td>
            <td>BYU-Idaho 25th Anniversary Devotional</td>
            <td>BYU-Idaho</td>
            <td>2026</td>
          </tr>
            <td>Elder Jeffery R. Holland</td>
            <td>Remember Lot's Wife</td>
            <td>BYU-Provo</td>
            <td>2009</td>
          <tr>
            <td>Elder James E. Fantone</td>
            <td>The Battle is the Lord's</td>
            <td>BYU-Idaho</td>
            <td>2026</td>
          </tr>
          <tr>
          </tr>
        </table>
      </div>
      <div class="content-box">
        <form>
          <label for="speaker">Speaker:</label>
          <input id="speaker" type="text" placeholder="President Nelson" required>
          <br>
          <label for="title">Title:</label>
          <input id="title" type="text" placeholder="Peacemakers Needed" required>
          <br>
          <label for="location">Location:</label>
          <input id="location" type="text" placeholder="Conference Center" required>
          <br>
          <label for="year">Year:</label>
          <input id="year" type="text" placeholder="2023" required>
          <br>
          <input id="submit" type="submit" value="Submit">
        </form>
      </div>
    </main>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apostles Spotlights</title>
    <style>
        body {
            margin: 0;
            background-color: #E8ECED;
        }
        #first-presidency {
            display: flex;
            justify-self: center;
            justify-content: center;
        }
        #quorum-of-the-twelve {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            justify-self: center;
            justify-content: center;
            margin-bottom: 50px;
        }
        #everyone img {
            border-radius: 100%;
            border: 8px solid white;
            object-fit: cover;
            margin: 10px
        }
        #everyone img:hover {
            border-color: aquamarine;
        }
        #quorum-of-the-twelve img {
            height: 100px;
            width: 100px;
        }
        #first-presidency img {
            height: 130px;
            width: 130px;
        }
        #everyone {
            
            background-image: url(images/christus.webp);
            background-repeat: no-repeat;
            background-size: cover;
            border-radius: 30px;
            border: 7px solid black;
            width: 80vw;
            justify-self: center;
            margin-top: 70px;
        }
        h1, h2 {
            text-align: center;
            color: white;
            font-family: Arial, sans-serif;
        }
        h1 {
            font-size: 3em;
        }
        h2 {
            font-size: 2em;
        }
        #first-presidency #oaks {
            height: 150px;
            width: 150px;
        }
        #first-presidency .notoaks {
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div id="everyone">
        <h1>First Presidency</h1>
        <div id="first-presidency">
            <img class="notoaks" src="images/eyring.webp" alt="Eyring">
            <img id="oaks" src="images/oaks.webp" alt="Oaks">
            <img class="notoaks" src="images/christofferson.webp" alt="Christofferson">
        </div>
        <h2>Quorum of the Twelve Apostles</h2>
        <div id="quorum-of-the-twelve">
            <img src="images/uchtdorf.webp" alt="Uchtdorf">
            <img src="images/bednar.webp" alt="Bednar">
            <img src="images/cook.webp" alt="Cook">
            <img src="images/anderson.webp" alt="Anderson">
            <img src="images/rasband.webp" alt="Rasband">
            <img src="images/stevenson.webp" alt="Stevenson">
            <img src="images/renlund.webp" alt="Renlund">
            <img src="images/gong.webp" alt="Gong">
            <img src="images/soares.webp" alt="Soares">
            <img src="images/kearon.webp" alt="Kearon">
            <img src="images/causse.webp" alt="Causse">
            <img src="images/gilbert.webp" alt="Gilbert">
        </div>
    </div>
</body>
</html>
